[workspace]
members = [
    "crates/ttc",
    "crates/ttc-syntax",
    "crates/ttc-diagnostics",
    "crates/ttc-emit",
    "crates/ttc-format",
    "crates/ttc-db",
    "crates/ttc-resolve",
    "crates/ttc-types",
    "crates/ttc-analyse",
    "crates/ttc-desugar",
    "crates/ttc-lsp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Typhon Contributors"]
license = "MIT"
repository = "https://github.com/CodeHalwell/Typhon"

[workspace.dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }

# Diagnostics
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Parser (fallback: rustpython-parser from crates.io)
rustpython-parser = "0.4"
rustpython-ast = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Incremental computation (Phase 1+)
salsa = "0.26"

# Internal crates
ttc-syntax      = { path = "crates/ttc-syntax" }
ttc-diagnostics = { path = "crates/ttc-diagnostics" }
ttc-emit        = { path = "crates/ttc-emit" }
ttc-format      = { path = "crates/ttc-format" }
ttc-db          = { path = "crates/ttc-db" }
ttc-resolve     = { path = "crates/ttc-resolve" }
ttc-types       = { path = "crates/ttc-types" }
ttc-analyse     = { path = "crates/ttc-analyse" }
ttc-desugar     = { path = "crates/ttc-desugar" }
ttc-lsp         = { path = "crates/ttc-lsp" }
