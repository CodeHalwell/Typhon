[package]
name = "ruff_python_parser"
version = "0.0.0-typhon-vendor"
edition = "2024"
rust-version = "1.93"
license.workspace = true
description = "Vendored copy of ruff_python_parser for Typhon (with val/var token support)"
publish = false

[lib]
test = true
doctest = false

[dev-dependencies]
# `insta` is used by upstream's inline `#[cfg(test)]` snapshot blocks in
# `src/lexer.rs` and `src/string.rs`. The snapshots themselves live in
# `src/snapshots/` (vendored verbatim from upstream).
insta = "1"

[[test]]
name = "typhon_mutability"
path = "tests/typhon_mutability.rs"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

[dependencies]
ruff_python_ast = { workspace = true, features = ["get-size"] }
ruff_python_trivia = { workspace = true }
ruff_text_size = { workspace = true, features = ["get-size"] }

bitflags = "2.5.0"
bstr = "1.9.1"
compact_str = "0.9.0"
get-size2 = { version = "0.10.3", features = ["derive", "smallvec", "hashbrown", "compact-str", "ordermap"] }
memchr = "2.7.1"
rustc-hash = "2.0.0"
static_assertions = "1.1.0"
unicode-ident = "1.0.12"
unicode-normalization = "0.1.23"
unicode_names2 = "1.2.2"
