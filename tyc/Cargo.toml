[workspace]
members = [
    "crates/tyc",
    "crates/tyc-syntax",
    "crates/tyc-diagnostics",
    "crates/tyc-emit",
    "crates/tyc-format",
    "crates/tyc-db",
    "crates/tyc-resolve",
    "crates/tyc-types",
    "crates/tyc-analyse",
    "crates/tyc-desugar",
    "crates/tyc-lsp",
    "crates/tyc-vm",
    "crates/tyc-venv",
    # Vendored Ruff parser/AST — Typhon's in-tree fork.
    # See `vendor/README.md` for the migration plan.
    "vendor/ruff_text_size",
    "vendor/ruff_source_file",
    "vendor/ruff_python_trivia",
    "vendor/ruff_python_ast",
    "vendor/ruff_python_parser",
]
resolver = "2"

[workspace.package]
version = "0.13.1"
edition = "2021"
authors = ["Typhon Contributors"]
license = "MIT"
repository = "https://github.com/CodeHalwell/Typhon"

[workspace.dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }

# Diagnostics
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# Incremental computation (Phase 1+)
salsa = "0.26"

# Language Server (Phase 2+)
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }

# File watching (used by `tyc ty --watch`)
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# VM runtime — pinned here so every crate that grows VM-facing deps
# (interp, builtins, value) stays version-aligned.
indexmap    = "2"
num-bigint  = "0.4"
num-integer = "0.1"
num-traits  = "0.2"
regex       = "1"

# Internal crates
tyc-syntax      = { path = "crates/tyc-syntax" }
tyc-diagnostics = { path = "crates/tyc-diagnostics" }
tyc-emit        = { path = "crates/tyc-emit" }
tyc-format      = { path = "crates/tyc-format" }
tyc-db          = { path = "crates/tyc-db" }
tyc-resolve     = { path = "crates/tyc-resolve" }
tyc-types       = { path = "crates/tyc-types" }
tyc-analyse     = { path = "crates/tyc-analyse" }
tyc-desugar     = { path = "crates/tyc-desugar" }
tyc-lsp         = { path = "crates/tyc-lsp" }
tyc-vm          = { path = "crates/tyc-vm" }

# Vendored Ruff fork — see vendor/README.md
ruff_text_size     = { path = "vendor/ruff_text_size" }
ruff_source_file   = { path = "vendor/ruff_source_file" }
ruff_python_trivia = { path = "vendor/ruff_python_trivia" }
ruff_python_ast    = { path = "vendor/ruff_python_ast" }
ruff_python_parser = { path = "vendor/ruff_python_parser" }
