# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Ignore unmaintained-only advisories for transitive deps we cannot control
# (all are pulled in by rustpython-parser; no security vulnerability involved).
ignore = [
    "RUSTSEC-2024-0436", # paste - unmaintained
    "RUSTSEC-2025-0075", # unic-char-range - unmaintained
    "RUSTSEC-2025-0080", # unic-common - unmaintained
    "RUSTSEC-2025-0081", # unic-char-property - unmaintained
    "RUSTSEC-2025-0090", # unic-ucd-ident - unmaintained
    "RUSTSEC-2025-0098", # unic-emoji-char - unmaintained
    "RUSTSEC-2025-0100", # unic-ucd-version - unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # malachite (transitive dep of rustpython-ast); copyleft applies only to
    # modifications of the library itself, not to linking in a binary tool.
    "LGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
