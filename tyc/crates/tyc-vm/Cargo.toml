[package]
name = "tyc-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typhon tree-walking interpreter — runs .ty source directly without compiling to Python"

[dependencies]
ruff_python_ast    = { workspace = true }
ruff_text_size     = { workspace = true }
ruff_python_parser = { workspace = true }
tyc-syntax         = { workspace = true }
tyc-desugar        = { workspace = true }
tyc-analyse        = { workspace = true }
thiserror          = { workspace = true }
regex              = { workspace = true }
indexmap           = { workspace = true }
num-bigint         = { workspace = true }
num-traits         = { workspace = true }
num-integer        = { workspace = true }

# `os.umask` has no `std` equivalent: only the raw syscall can read *and*
# set the process mask, and a program that sets one before writing a
# credentials file is relying on it.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
