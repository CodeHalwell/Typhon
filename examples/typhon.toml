[project]
name = "typhon-examples"
version = "0.1.0"
src = "."
out = "build"

[python]
target = "3.13"

[emit]
class-default = "dataclass"
format = true

[strictness]
no-implicit-any = true
unused-import = "warn"
exhaustive-match = "error"
methods-in-class-body = "warn"

[dependencies]
requests = ">=2.31"
httpx = ">=0.27"
pydantic = ">=2.6"
sqlalchemy = ">=2.0"
redis = ">=5.0"
fastapi = ">=0.111"
uvicorn = ">=0.30"
numpy = ">=1.26"
pandas = ">=2.2"
matplotlib = ">=3.8"
scikit-learn = ">=1.4"
torch = ">=2.3"
transformers = ">=4.40"
pillow = ">=10.0"
pypdf = ">=4.0"
anthropic = ">=0.34"
beautifulsoup4 = ">=4.12"
rich = "*"
typer = ">=0.12"
aiofiles = ">=23.2"

[dev-dependencies]
pytest = "8.2"
pytest-asyncio = "0.23"
