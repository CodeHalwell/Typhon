[project]
name = "mini-research-assistant"
version = "0.1.0"
src = "src"
out = "build"

[python]
target = "3.13"

[emit]
class-default = "dataclass"
format = true

[strictness]
no-implicit-any = true
exhaustive-match = "error"
methods-in-class-body = "warn"

[env]
required = []

[dependencies]
fastapi = ">=0.111"
uvicorn = ">=0.30"
pydantic = ">=2.6"
anthropic = ">=0.34"
