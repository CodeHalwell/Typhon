  <circle cx="38" cy="48" r="2.5" fill="#ff4500" filter="url(#shadow)"/>
  <circle cx="62" cy="48" r="2.5" fill="#ff4500" filter="url(#shadow)"/>

  <path d="M 51 32
           L 41 58
           H 54
           L 47 80
