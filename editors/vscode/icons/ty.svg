    <pattern id="scales" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 10 5 L 5 10 L 0 5 Z" fill="none" stroke="#265175" stroke-width="0.75"/>
    </pattern>
  </defs>

  <path d="M 20 10
