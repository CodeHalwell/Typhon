name: VS Code Extension

on:
  push:
    branches: ["main", "dev/**", "claude/**"]
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"

# Least privilege: this workflow only builds and packages the extension. A
# read-only token keeps a compromised npm dependency from writing to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        # Pinned: an unpinned `npx --yes @vscode/vsce` floats to whatever the
        # registry serves that day (@vscode/vsce@3.2.1 verified, engines
        # node>=20 matches this job's node 20).
        run: npx --yes @vscode/vsce@3.2.1 package --allow-missing-repository --out typhon.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typhon-vscode-extension
          path: editors/vscode/typhon.vsix
          if-no-files-found: error
