name: Auto-tag on main

# On every push to `main` (which is what a PR merge produces), look at
# the workspace version in `tyc/Cargo.toml`. If there is no matching
# `v<version>` tag yet, create one at this commit and trigger the
# Release workflow so the macOS binaries + GitHub Release get
# published automatically.
#
# Why this isn't just `git push origin <tag>`:
#   Tags pushed by the default `GITHUB_TOKEN` do not trigger other
#   workflows — that's a hard-coded GitHub policy to avoid recursive CI
#   loops. We therefore push the tag *and* explicitly invoke
#   `release.yml` via `gh workflow run`, which `GITHUB_TOKEN` is
#   allowed to do.
#
# If the version in `Cargo.toml` is unchanged (the same `v<version>`
# tag already exists), this workflow exits cleanly — re-running it on
# unrelated commits to main is a no-op.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Only one auto-tag run at a time per validated commit — back-to-back
# merges would otherwise race on tag creation.
concurrency:
  group: auto-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    name: Tag + dispatch release
    runs-on: ubuntu-latest
    # Only tag/publish a commit whose CI run on main actually passed AND that
    # originated from this repository — never a fork. A `workflow_run` with
    # `branches: [main]` matches on the *head branch name* of the triggering
    # run, so a fork PR opened from a branch literally named `main` would
    # otherwise reach this privileged job (contents+actions write) and check
    # out the fork's commit. The head-repository guard closes that.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Tag the exact commit CI validated, not the current tip of main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read workspace version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Take the first `version = "X.Y.Z"` line in workspace.package.
          # tyc/Cargo.toml is small and the workspace.package block is
          # the only one that uses the literal `version = "…"` shape
          # (every crate uses `version.workspace = true`).
          version="$(grep -m1 -E '^version = "' tyc/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::could not read workspace version from tyc/Cargo.toml"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved workspace version: ${version} (tag: ${tag})"

      - name: Check whether tag already exists
        id: check
        shell: bash
        # `TAG` is passed through the environment, never interpolated into the
        # script body with `${{ }}`: the value is derived from a `grep` over
        # `tyc/Cargo.toml`, so treating it as data (not code) keeps a crafted
        # version string from running as a shell command substitution.
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist yet — will create."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} at $(git rev-parse HEAD)"

      - name: Dispatch Release workflow
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # `release.yml`'s `workflow_dispatch` accepts a `tag` input
          # and (optionally) a `ref`. Now that the tag exists, leave
          # `ref` empty so the release workflow checks out the tag
          # itself — guaranteeing the build matches the commit that
          # the tag points at.
          gh workflow run release.yml \
            --ref main \
            -f tag="${TAG}"
          echo "Dispatched Release workflow for ${TAG}"
