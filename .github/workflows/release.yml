name: Release

# Build pre-built `tyc` binaries for macOS, Linux, and Windows on every
# `v*` tag and attach the archives + checksums to a GitHub Release.
#
# Matrix:
#   macOS:    aarch64-apple-darwin, x86_64-apple-darwin
#   Linux:    x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu (cross-built)
#   Windows:  x86_64-pc-windows-msvc

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit SHA to build from. Leave empty to build from `tag` itself (re-release an existing tag). Set this when `tag` does not yet exist — the tag will be created at this ref."
        required: false
        type: string
        default: ""
      overwrite:
        description: "Allow replacing the assets of a release that is already published for `tag`. Leave off unless you are deliberately re-publishing."
        required: false
        type: boolean
        default: false

# Least privilege by default: the five `build` jobs compile ~250 third-party
# crates (build scripts and proc-macros run arbitrary code), so they get a
# read-only token. Only the `release` job, which runs no third-party build
# code, is granted write access (see its own `permissions:` block).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            archive: zip

    steps:
      # On a tag push, build the tag itself. On workflow_dispatch, build
      # the user-provided `ref` if any — otherwise fall back to `inputs.tag`
      # so that re-releasing an existing tag still builds from the tag's
      # commit (not the workflow branch HEAD). Releasing an as-yet-uncreated
      # tag is supported by passing `ref` explicitly; action-gh-release then
      # creates `tag_name` at the build SHA.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref }}
          # Do not leave the token in `.git/config` where build scripts
          # could read it.
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        shell: bash
        # `${{ inputs.tag }}` travels via `env:`, never interpolated into
        # `run:` (workflow_dispatch inputs are user-controlled).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (version: $version)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # Release binaries are fully cold builds: no Actions cache is restored,
      # neither a prior `tyc/target/` nor `~/.cargo/registry`. cargo does not
      # re-verify already-extracted registry sources, so a cache entry written
      # by any other job on the default branch could otherwise end up in a
      # shipped binary.

      - name: Install cross-compile toolchain (Linux aarch64)
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross-linker (Linux aarch64)
        if: matrix.linker != ''
        run: |
          mkdir -p ~/.cargo
          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          {
            echo "[target.${{ matrix.target }}]"
            echo "linker = \"${{ matrix.linker }}\""
          } >> ~/.cargo/config.toml
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build tyc (release, ${{ matrix.target }})
        working-directory: tyc
        shell: bash
        run: |
          # `--locked`: ship exactly the dependency versions in the reviewed
          # Cargo.lock; fail rather than silently re-resolve.
          cargo build --locked --release -p tyc --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'macos'
        # No paid Apple Developer cert — use ad-hoc signature (`-`).
        # This avoids the silent "killed: 9" Gatekeeper failure on macOS;
        # users will still see a one-time "downloaded from internet"
        # prompt unless they clear the quarantine xattr (the installer
        # does this automatically).
        run: |
          bin="tyc/target/${{ matrix.target }}/release/tyc"
          codesign --sign - --force --timestamp=none "$bin"
          codesign --verify --verbose "$bin"

      - name: Package archive + checksum (POSIX)
        if: matrix.archive == 'tar.gz'
        id: package_posix
        shell: bash
        # Step outputs travel via `env:`, never interpolated into `run:`.
        env:
          PKG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          version="$PKG_VERSION"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          name="tyc-${version}-${target}"
          mkdir -p "$stage/$name"
          cp "tyc/target/${target}/release/tyc" "$stage/$name/tyc"
          # LICENSE is mandatory — fail the release if it is missing rather
          # than silently shipping binaries with no license text.
          cp LICENSE "$stage/$name/LICENSE"
          cp tyc/vendor/LICENSE "$stage/$name/LICENSE-ruff"
          cp README.md "$stage/$name/README.md" 2>/dev/null || true

          mkdir -p dist
          # Record root (0:0) as the owner of every member instead of the
          # runner's build account, so that extracting as root cannot hand
          # the files to whichever local uid happens to match. GNU tar (the
          # Linux runners) and bsdtar (the macOS runners) spell this
          # differently.
          if tar --version 2>/dev/null | grep -q 'GNU tar'; then
            tar_owner=(--owner=0 --group=0 --numeric-owner)
          else
            tar_owner=(--uid 0 --gid 0)
          fi
          tar -C "$stage" "${tar_owner[@]}" -czf "dist/${name}.tar.gz" "$name"
          # Pick whichever sha256 tool exists on the runner. macOS ships
          # `shasum`; Ubuntu ships `sha256sum`. Both emit the same
          # `<hash>  <file>` line shape that the combined SHA256SUMS
          # file expects.
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
          ls -la dist/
          echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Package archive + checksum (Windows)
        if: matrix.archive == 'zip'
        id: package_windows
        shell: pwsh
        # Step outputs travel via `env:`, never interpolated into `run:`.
        env:
          PKG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PKG_VERSION
          $target  = '${{ matrix.target }}'
          $name    = "tyc-$version-$target"
          $stage   = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $name) -Force
          Copy-Item "tyc/target/$target/release/tyc.exe" (Join-Path $stage.FullName 'tyc.exe')
          # LICENSE is mandatory — Copy-Item throws (Stop) if it is missing.
          Copy-Item 'LICENSE'           (Join-Path $stage.FullName 'LICENSE')
          Copy-Item 'tyc/vendor/LICENSE' (Join-Path $stage.FullName 'LICENSE-ruff')
          if (Test-Path 'README.md') { Copy-Item 'README.md' (Join-Path $stage.FullName 'README.md') }

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $zipPath = "dist/$name.zip"
          # Pass the stage directory itself (not its parent) to
          # Compress-Archive. Because the stage directory is named
          # `$name` (`tyc-X.Y.Z-target`), the zip's top-level entry
          # ends up as `$name\` — the same shape the POSIX `tar.gz`
          # path produces, and what install.ps1 expects when it looks
          # for `tyc.exe` under `tyc-$version-$target/`.
          Compress-Archive -Path $stage.FullName -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          # `<hash>  <file>` — two spaces, matching the POSIX
          # `shasum -c` / `sha256sum -c` line format.
          Set-Content -Path "$zipPath.sha256" -Value "$hash  $name.zip"
          Get-ChildItem dist
          "asset=$zipPath"            | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$zipPath.sha256"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name"                | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive == 'zip' && steps.package_windows.outputs.name || steps.package_posix.outputs.name }}
          path: |
            ${{ matrix.archive == 'zip' && steps.package_windows.outputs.asset || steps.package_posix.outputs.asset }}
            ${{ matrix.archive == 'zip' && steps.package_windows.outputs.checksum || steps.package_posix.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publishing goes through the `release` deployment environment so that
    # required reviewers (and a wait timer, or a tag/branch restriction) can
    # be switched on under Settings -> Environments without another workflow
    # change. An environment with no protection rules passes straight
    # through — GitHub creates it on first use — so this is a no-op until
    # someone configures it.
    environment: release
    permissions:
      contents: write        # create the tag / release and upload assets
      id-token: write        # sign the build-provenance attestation
      attestations: write    # store the attestation
    steps:
      # A published release is what `install.sh` / `install.ps1` download, and
      # its archives are what the attestations below vouch for. Re-running
      # this workflow for a tag that already has assets would silently swap
      # those bytes, so refuse unless the run was dispatched with
      # `overwrite: true`. (A tag push never sets it; `auto-tag.yml`
      # dispatches without it and only ever for a brand-new tag.) A release
      # that does not exist yet, or exists with no assets, counts as zero.
      # Every value travels via `env:`, never interpolated into `run:`.
      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if out="$(gh release view "$TAG" --json assets --jq '.assets | length' 2>&1)"; then
            count="$out"
          elif printf '%s\n' "$out" | grep -qi 'release not found'; then
            count=0
          else
            # Not the wording we know for "no such release". Rather than
            # guess, ask the REST API, where a missing release is an
            # unambiguous HTTP 404.
            err="$(mktemp)"
            if rest="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets | length' 2>"$err")"; then
              count="$rest"
            elif grep -q 'HTTP 404' "$err"; then
              count=0
            else
              echo "::error::could not query the release for ${TAG}: ${out} / $(cat "$err")"
              exit 1
            fi
          fi
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::unexpected asset count for ${TAG}: ${count}"
              exit 1
              ;;
          esac
          echo "Release ${TAG} currently has ${count} asset(s)."
          if [ "$count" -gt 0 ]; then
            if [ "$OVERWRITE" = "true" ]; then
              echo "::warning::overwrite=true: replacing the ${count} existing asset(s) of ${TAG}."
            else
              echo "::error::release ${TAG} already has ${count} asset(s); refusing to replace them. Re-run via workflow_dispatch with overwrite=true if that is intended."
              exit 1
            fi
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        # `${{ inputs.tag }}` travels via `env:`, never interpolated into
        # `run:` (workflow_dispatch inputs are user-controlled).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Capture the SHA actually checked out, so action-gh-release
          # can create a missing tag at this commit (workflow_dispatch
          # path). For a tag-push trigger this still resolves to the
          # tagged commit.
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        # Bump this together with `upload-artifact` above (with a
        # pre-release dry-run tag): the pairing across majors matters and
        # this job is the release pipeline.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble release directory + combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Each artifact lives under artifacts/<name>/dist/<archive>
          # (and .sha256). Flatten and recompute the combined SHA256SUMS.
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          # Combined SHA256SUMS covers both .tar.gz and .zip assets;
          # `install.sh` and `install.ps1` both grep their target asset
          # out of this file by exact filename match.
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          ls -la release/
          cat release/SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          draft: false
          # A tag containing a hyphen (v1.0.0-alpha.2, -beta, -rc.1) is a
          # pre-release; a bare vX.Y.Z is a stable release. This keeps
          # alpha/beta tags from carrying the green "Latest" badge.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS

      # Signed SLSA build provenance for every archive, so a download can be
      # tied back to this workflow run and source commit independently of
      # the same-origin SHA256SUMS file:
      #   gh attestation verify tyc-<version>-<target>.tar.gz --repo CodeHalwell/Typhon
      # Runs after publishing so that an attestation-service outage cannot
      # block a release; the job still goes red. Recovering then means a new
      # workflow_dispatch run with `overwrite: true` — the guard at the top of
      # this job refuses a plain re-run, because the assets already exist.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
