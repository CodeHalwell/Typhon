name: Release

# Build pre-built `tyc` binaries for macOS, Linux, and Windows on every
# `v*` tag and attach the archives + checksums to a GitHub Release.
#
# Matrix:
#   macOS:    aarch64-apple-darwin, x86_64-apple-darwin
#   Linux:    x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu (cross-built)
#   Windows:  x86_64-pc-windows-msvc

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit SHA to build from. Leave empty to build from `tag` itself (re-release an existing tag). Set this when `tag` does not yet exist — the tag will be created at this ref."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            archive: zip

    steps:
      # On a tag push, build the tag itself. On workflow_dispatch, build
      # the user-provided `ref` if any — otherwise fall back to `inputs.tag`
      # so that re-releasing an existing tag still builds from the tag's
      # commit (not the workflow branch HEAD). Releasing an as-yet-uncreated
      # tag is supported by passing `ref` explicitly; action-gh-release then
      # creates `tag_name` at the build SHA.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (version: $version)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross-compile toolchain (Linux aarch64)
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross-linker (Linux aarch64)
        if: matrix.linker != ''
        run: |
          mkdir -p ~/.cargo
          target_upper="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          {
            echo "[target.${{ matrix.target }}]"
            echo "linker = \"${{ matrix.linker }}\""
          } >> ~/.cargo/config.toml
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build tyc (release, ${{ matrix.target }})
        working-directory: tyc
        shell: bash
        run: |
          cargo build --release -p tyc --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'macos'
        # No paid Apple Developer cert — use ad-hoc signature (`-`).
        # This avoids the silent "killed: 9" Gatekeeper failure on macOS;
        # users will still see a one-time "downloaded from internet"
        # prompt unless they clear the quarantine xattr (the installer
        # does this automatically).
        run: |
          bin="tyc/target/${{ matrix.target }}/release/tyc"
          codesign --sign - --force --timestamp=none "$bin"
          codesign --verify --verbose "$bin"

      - name: Package archive + checksum (POSIX)
        if: matrix.archive == 'tar.gz'
        id: package_posix
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          name="tyc-${version}-${target}"
          mkdir -p "$stage/$name"
          cp "tyc/target/${target}/release/tyc" "$stage/$name/tyc"
          # LICENSE is mandatory — fail the release if it is missing rather
          # than silently shipping binaries with no license text.
          cp LICENSE "$stage/$name/LICENSE"
          cp tyc/vendor/LICENSE "$stage/$name/LICENSE-ruff"
          cp README.md "$stage/$name/README.md" 2>/dev/null || true

          mkdir -p dist
          tar -C "$stage" -czf "dist/${name}.tar.gz" "$name"
          # Pick whichever sha256 tool exists on the runner. macOS ships
          # `shasum`; Ubuntu ships `sha256sum`. Both emit the same
          # `<hash>  <file>` line shape that the combined SHA256SUMS
          # file expects.
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
          ls -la dist/
          echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Package archive + checksum (Windows)
        if: matrix.archive == 'zip'
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.tag.outputs.version }}'
          $target  = '${{ matrix.target }}'
          $name    = "tyc-$version-$target"
          $stage   = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $name) -Force
          Copy-Item "tyc/target/$target/release/tyc.exe" (Join-Path $stage.FullName 'tyc.exe')
          # LICENSE is mandatory — Copy-Item throws (Stop) if it is missing.
          Copy-Item 'LICENSE'           (Join-Path $stage.FullName 'LICENSE')
          Copy-Item 'tyc/vendor/LICENSE' (Join-Path $stage.FullName 'LICENSE-ruff')
          if (Test-Path 'README.md') { Copy-Item 'README.md' (Join-Path $stage.FullName 'README.md') }

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $zipPath = "dist/$name.zip"
          # Pass the stage directory itself (not its parent) to
          # Compress-Archive. Because the stage directory is named
          # `$name` (`tyc-X.Y.Z-target`), the zip's top-level entry
          # ends up as `$name\` — the same shape the POSIX `tar.gz`
          # path produces, and what install.ps1 expects when it looks
          # for `tyc.exe` under `tyc-$version-$target/`.
          Compress-Archive -Path $stage.FullName -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          # `<hash>  <file>` — two spaces, matching the POSIX
          # `shasum -c` / `sha256sum -c` line format.
          Set-Content -Path "$zipPath.sha256" -Value "$hash  $name.zip"
          Get-ChildItem dist
          "asset=$zipPath"            | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$zipPath.sha256"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name"                | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive == 'zip' && steps.package_windows.outputs.name || steps.package_posix.outputs.name }}
          path: |
            ${{ matrix.archive == 'zip' && steps.package_windows.outputs.asset || steps.package_posix.outputs.asset }}
            ${{ matrix.archive == 'zip' && steps.package_windows.outputs.checksum || steps.package_posix.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Capture the SHA actually checked out, so action-gh-release
          # can create a missing tag at this commit (workflow_dispatch
          # path). For a tag-push trigger this still resolves to the
          # tagged commit.
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        # Kept on the v4 line to match upload-artifact@v4 above: artifact
        # up/download pairing across majors is unverified, and this job is
        # the release pipeline. Bump BOTH halves together (with a
        # pre-release dry-run tag) when moving off v4.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Assemble release directory + combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Each artifact lives under artifacts/<name>/dist/<archive>
          # (and .sha256). Flatten and recompute the combined SHA256SUMS.
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          # Combined SHA256SUMS covers both .tar.gz and .zip assets;
          # `install.sh` and `install.ps1` both grep their target asset
          # out of this file by exact filename match.
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          ls -la release/
          cat release/SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          draft: false
          # A tag containing a hyphen (v1.0.0-alpha.2, -beta, -rc.1) is a
          # pre-release; a bare vX.Y.Z is a stable release. This keeps
          # alpha/beta tags from carrying the green "Latest" badge.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
