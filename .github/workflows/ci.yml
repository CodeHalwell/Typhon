name: CI

on:
  push:
    branches: ["main", "dev/**", "claude/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tyc

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # The cache is an optimization, never a correctness requirement: a
        # cache-service outage must not fail CI (observed 2026-07-09 — the
        # restore step died before any code step ran). Cold builds are
        # slower but correct.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The suite executes the Python `tyc build` emits. Without an
      # interpreter those tests skip — and a skip nothing observes is
      # indistinguishable from a pass, so this job was reporting green for a
      # tier that never ran. `TYC_REQUIRE_PYTHON` turns a missing interpreter
      # into a failure rather than a silent skip.
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Tests
        run: cargo test --workspace
        env:
          TYC_REQUIRE_PYTHON: "1"

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency audit (advisories + licences + bans)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          manifest-path: tyc/Cargo.toml

  perf-gate:
    name: Performance regression gate (F2)
    runs-on: ubuntu-latest
    # Times the full `tyc build` pipeline over a fixed, network-free corpus and
    # fails if the median regresses >20% past the committed perf-baseline.json.
    # Methodology + how to refresh the baseline: docs/performance-baseline.md.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Run build-pipeline perf gate
        # Median of several runs vs. committed baseline; >20% slower fails.
        # The gate is network-free (`--no-sync --check`) and uses only
        # bash + python3 + jq, all present on ubuntu-latest runners.
        run: scripts/perf-gate.sh
