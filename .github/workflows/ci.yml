name: CI

on:
  push:
    branches: ["main", "dev/**", "claude/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tyc

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # The cache is an optimization, never a correctness requirement: a
        # cache-service outage must not fail CI (observed 2026-07-09 — the
        # restore step died before any code step ran). Cold builds are
        # slower but correct.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The suite executes the Python `tyc build` emits. Without an
      # interpreter those tests skip — and a skip nothing observes is
      # indistinguishable from a pass, so this job was reporting green for a
      # tier that never ran. `TYC_REQUIRE_PYTHON` turns a missing interpreter
      # into a failure rather than a silent skip.
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # The format-stage source-map tests (tests/source_map.rs) only exercise
      # the reflow/re-key logic when `ruff format` actually reflows — without
      # ruff on PATH those assertions are inert and the tests pass vacuously.
      # Pinned so a ruff formatting-style change can't silently alter what the
      # assertions exercise; TYC_REQUIRE_RUFF below is the loud counterpart
      # (the same convention as TYC_REQUIRE_PYTHON).
      - name: Install ruff (format-stage source-map tests)
        run: python -m pip install --quiet ruff==0.15.8

      - name: Tests
        run: cargo test --workspace
        env:
          TYC_REQUIRE_PYTHON: "1"
          TYC_REQUIRE_RUFF: "1"

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency audit (advisories + licences + bans)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          manifest-path: tyc/Cargo.toml

  perf-gate:
    name: Performance regression gate (F2)
    runs-on: ubuntu-latest
    # Times the full `tyc build` pipeline over a fixed, network-free corpus and
    # fails if the median regresses >20% past the committed perf-baseline.json.
    # Methodology + how to refresh the baseline: docs/performance-baseline.md.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Run build-pipeline perf gate
        # Median of several runs vs. committed baseline; >20% slower fails.
        # The gate is network-free (`--no-sync --check`) and uses only
        # bash + python3 + jq, all present on ubuntu-latest runners.
        run: scripts/perf-gate.sh

  differential:
    name: VM ↔ CPython differential (T0.2)
    runs-on: ubuntu-latest
    # The VM (`tyc run`) is contractually a drop-in for `tyc build` + CPython.
    # Nothing verified that before this job: the VM was a second, independent
    # implementation of Python semantics with no differential coverage at all.
    # This builds and executes every unit in examples/ + stress/ both ways and
    # diffs stdout + exit code. Known divergences are pinned in
    # scripts/differential-baseline.txt; the job fails on a NEW divergence and
    # equally on a baseline entry that has stopped diverging, so the expectations
    # file can only shrink. Every line in it is a VM bug.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      # Emitted Typhon targets CPython 3.13+. `python3.13` must exist by that
      # exact name — the harness refuses to fall back to an older `python3`,
      # because a harness that runs the wrong interpreter (or skips) reports
      # green for a tier that never ran.
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # The per-unit classifications (ok / diverge / vacuous) depend on which
      # third-party packages the ambient python3.13 can import — see the
      # header of scripts/differential-baseline.txt. The baseline was recorded
      # with pydantic and PyYAML importable (every `model` class needs
      # pydantic at runtime; one stress unit imports yaml), so CI must match
      # or those units flip classification on a pristine runner. Versions are
      # pinned to the recording environment's. Deliberately NOT
      # continue-on-error: with the packages missing, the harness would fail
      # later with confusing divergence noise instead of a clear install error.
      - name: Install baseline runtime packages (pydantic, PyYAML)
        run: python3.13 -m pip install --quiet pydantic==2.13.4 PyYAML==6.0.1

      - name: Differential harness (examples + stress)
        run: scripts/vm-differential.sh --jobs 4 --report differential-report.tsv
        env:
          TYC_REQUIRE_PYTHON: "1"

      - name: Upload per-unit differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-report
          path: differential-report.tsv
          if-no-files-found: warn

  knob-matrix:
    name: Opt-in knob codegen matrix (T0.4)
    runs-on: ubuntu-latest
    # examples/ and stress/ run entirely on default configuration, so every
    # opt-in codegen path — auto-parallel, the parallel backends, PGO memoise,
    # traceback-remap, the free-threaded targets, the PEP 810 lazy-import
    # lowering — shipped with zero end-to-end coverage. Each fixture under
    # tests/knobs/ builds with the knob on AND off, asserts the rewrite fired
    # (and is absent in the control), and asserts the observable behaviour is
    # unchanged.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Only the model-extra fixture needs this, and only for its execution
      # half; without it that fixture reports "REDUCED to build-only" rather
      # than silently skipping. Installing it here keeps CI at full coverage
      # while `scripts/knob-matrix.sh` itself stays network-free for local runs.
      - name: Install pydantic (model-extra fixture runtime)
        run: python3.13 -m pip install --quiet pydantic
        continue-on-error: true

      - name: Knob codegen matrix
        run: scripts/knob-matrix.sh
        env:
          TYC_REQUIRE_PYTHON: "1"
