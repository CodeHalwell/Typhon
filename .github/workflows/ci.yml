name: CI

on:
  push:
    branches: ["main", "dev/**", "claude/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least privilege: every job here only checks out and builds/tests. Pinning the
# token to read-only means a compromised build script or dependency cannot use
# the workflow token to write to the repo. Bump per-job if a job ever needs more.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tyc

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # The cache is an optimization, never a correctness requirement: a
        # cache-service outage must not fail CI (observed 2026-07-09 — the
        # restore step died before any code step ran). Cold builds are
        # slower but correct.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The suite executes the Python `tyc build` emits. Without an
      # interpreter those tests skip — and a skip nothing observes is
      # indistinguishable from a pass, so this job was reporting green for a
      # tier that never ran. `TYC_REQUIRE_PYTHON` turns a missing interpreter
      # into a failure rather than a silent skip.
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The format-stage source-map tests (tests/source_map.rs) only exercise
      # the reflow/re-key logic when `ruff format` actually reflows — without
      # ruff on PATH those assertions are inert and the tests pass vacuously.
      # Pinned so a ruff formatting-style change can't silently alter what the
      # assertions exercise; TYC_REQUIRE_RUFF below is the loud counterpart
      # (the same convention as TYC_REQUIRE_PYTHON).
      - name: Install ruff (format-stage source-map tests)
        run: python -m pip install --quiet ruff==0.15.8

      - name: Tests
        run: cargo test --workspace
        env:
          TYC_REQUIRE_PYTHON: "1"
          TYC_REQUIRE_RUFF: "1"

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    # Non-blocking while the day-one cross-platform failures land (W4-01,
    # W4-02, W5-01, W5-02). Flip to a hard gate after ~1 week green.
    continue-on-error: true
    defaults:
      run:
        working-directory: tyc

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Same convention as the Linux job: the cache is an optimization,
        # never a correctness requirement.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Same loud-interpreter convention as the Linux job: a missing
      # interpreter must fail loudly, never skip silently.
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install ruff (format-stage source-map tests)
        run: python -m pip install --quiet ruff==0.15.8

      - name: Tests
        run: cargo test --workspace
        env:
          TYC_REQUIRE_PYTHON: "1"
          TYC_REQUIRE_RUFF: "1"

  fmt-guard:
    name: Formatter scope guard
    runs-on: ubuntu-latest
    # `cargo fmt` must never reformat a file the change did not otherwise
    # touch: a drive-by reformat hides in review and conflicts with every
    # parallel workstream. This job fails when `cargo fmt --check` flags a
    # `.rs` file outside the change's own file list.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"
          components: rustfmt

      - name: Fail on out-of-scope reformats
        working-directory: tyc
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            # No base commit (e.g. a new branch's first push): compare
            # against the empty tree, i.e. require a fully clean tree.
            base="4b825dc642cb6b88a060e54bf8d69288fbee4904"
          fi
          # Files the change itself touches (added, copied, modified,
          # renamed — not deleted or type-changed). `git diff --name-only`
          # prints repo-root-relative paths whatever the cwd is.
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.rs' | sort -u)
          # Files rustfmt would rewrite, normalised the same way. rustfmt
          # prints absolute paths with a trailing `:line:`; $PWD here is
          # <root>/tyc.
          mapfile -t unformatted < <(cargo fmt -- --check 2>&1 | sed -n 's|^Diff in \(.*\)$|\1|p' | sed -e 's|:[0-9]*:$||' -e 's|:[0-9]*$||' -e "s|^$PWD/|tyc/|" | sort -u)
          if [ "${#unformatted[@]}" -eq 0 ]; then
            echo "tree is rustfmt-clean"
            exit 0
          fi
          offenders=$(comm -23 <(printf '%s\n' "${unformatted[@]}") <(printf '%s\n' "${changed[@]}"))
          if [ -n "$offenders" ]; then
            echo "::error::cargo fmt would reformat files this change does not touch:"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "rustfmt touches only files in this change (or the tree is clean)"

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency audit (advisories + licences + bans)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          manifest-path: tyc/Cargo.toml

  perf-gate:
    name: Performance regression gate (F2)
    runs-on: ubuntu-latest
    # Times the full `tyc build` pipeline over a fixed, network-free corpus and
    # fails if the median regresses >20% past the committed perf-baseline.json.
    # Methodology + how to refresh the baseline: docs/performance-baseline.md.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Run build-pipeline perf gate
        # Median of several runs vs. committed baseline; >20% slower fails.
        # The gate is network-free (`--no-sync --check`) and uses only
        # bash + python3 + jq, all present on ubuntu-latest runners.
        run: scripts/perf-gate.sh

  differential:
    name: VM ↔ CPython differential (T0.2)
    runs-on: ubuntu-latest
    # The VM (`tyc run`) is contractually a drop-in for `tyc build` + CPython.
    # Nothing verified that before this job: the VM was a second, independent
    # implementation of Python semantics with no differential coverage at all.
    # This builds and executes every unit in examples/ + stress/ both ways and
    # diffs stdout + exit code. Known divergences are pinned in
    # scripts/differential-baseline.txt; the job fails on a NEW divergence and
    # equally on a baseline entry that has stopped diverging, so the expectations
    # file can only shrink. Every line in it is a VM bug.
    #
    # The same pass carries two more gates, because it already builds every
    # unit:
    #   * every emitted `.py` is byte-compiled with `compileall`, so an
    #     emitter bug in a module no code path imports still fails the build
    #     (`noncompiling` — an EMITTER bug, never baselined); and
    #   * units that do not survive `tyc build` are pinned in
    #     scripts/nobuild-baseline.txt. Most are diagnostic probes written to
    #     be rejected, so that list is not a burn-down — but it fails in both
    #     directions, so a unit that stops building is caught as a regression
    #     and one that starts building is caught as a diagnostic that stopped
    #     firing.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      # Emitted Typhon targets CPython 3.13+. `python3.13` must exist by that
      # exact name — the harness refuses to fall back to an older `python3`,
      # because a harness that runs the wrong interpreter (or skips) reports
      # green for a tier that never ran.
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The per-unit classifications (ok / diverge / vacuous / vacuous-runtime)
      # depend on which
      # third-party packages the ambient python3.13 can import — see the
      # header of scripts/differential-baseline.txt. The baseline was recorded
      # with pydantic and PyYAML importable (every `model` class needs
      # pydantic at runtime; one stress unit imports yaml), so CI must match
      # or those units flip classification on a pristine runner. Versions are
      # pinned to the recording environment's. Deliberately NOT
      # continue-on-error: with the packages missing, the harness would fail
      # later with confusing divergence noise instead of a clear install error.
      - name: Install baseline runtime packages (pydantic, PyYAML)
        run: python3.13 -m pip install --quiet pydantic==2.13.4 PyYAML==6.0.1

      # Resource snapshot around the harness. On 2026-08-09 this job was killed
      # mid-harness four times in an hour by "The runner has received a
      # shutdown signal", across three branches, while other jobs on the same
      # commits passed. That was read at the time as a transient hosted-runner
      # incident; it was not. Disk was measured and correctly ruled out (one
      # ~190 KB scratch workdir per unit, now removed per-unit anyway), but
      # memory was never measured — a killed runner never reaches the `always()`
      # post-step, so only a run that SURVIVES produces the numbers that matter:
      #
      #   after a full harness at --jobs 4:  mem 11.1G/15.9G used, available
      #   4.8G (from 14.9G), swap 3061M/3071M — 99.7% exhausted.
      #
      # That measurement is real and worth avoiding on its own — but it is NOT
      # the cause of the kills, and --jobs 2 below did not stop them: the gate
      # was killed again at 59s with the same signature on the very commit that
      # introduced the setting, while the twin run on that same commit passed.
      #
      # Falsified so far, each by direct evidence:
      #   - disk            (alpha.8 measured it; ~190 KB scratch per unit)
      #   - duplicate runs  (a run died alone; a duplicated run passed)
      #   - memory / jobs=4 (jobs=2 dies too, and earlier in the harness)
      #   - corpus signals  (no unit sends SIGTERM/SIGKILL or touches killpg)
      #
      # Observed rate is ~4 kills in 9 attempts, across both job counts, both
      # trigger events, alone and duplicated, and independent of the diff. It
      # reproduces only on hosted runners, and a killed runner leaves no
      # post-mortem, which is what makes it stubborn. Re-running the job clears
      # it. Keep the snapshots — they are the only numbers anyone gets.
      - name: Resources before differential harness
        run: df -h . /tmp && free -m

      - name: Differential harness (examples + stress)
        run: scripts/vm-differential.sh --jobs 2 --report differential-report.tsv
        env:
          TYC_REQUIRE_PYTHON: "1"

      - name: Resources after differential harness
        if: always()
        run: df -h . /tmp && free -m

      - name: Upload per-unit differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-report
          path: differential-report.tsv
          if-no-files-found: warn

  valid-corpus:
    name: Valid-programs corpus (W6-18)
    runs-on: ubuntu-latest
    # corpus/valid/ is real, ordinary libraries (migrated stdlib), hand-fixed
    # once and kept green. The stress corpus is mostly programs written to
    # break the checker; the W1-01/W1-02 false-positive regressions got
    # through for lack of a corpus like this one. Two gates, both fail shut:
    #   * `tyc check corpus/valid/` — every new diagnostic is swept over
    #     ordinary code automatically. Warnings are tolerated (advice lints
    #     such as lazy_import_opportunity fire on faithful migrations);
    #     errors fail.
    #   * the VM <-> CPython differential over --scope valid, pinned by
    #     scripts/valid-corpus-baseline.txt (same both-directions-fail
    #     contract as the main differential job, OWN baseline file so the two
    #     gates evolve independently).
    # The corpus is stdlib-only by design, so unlike the differential job this
    # needs no third-party runtime packages.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The checker's false-positive sweep: ordinary code must stay clean.
      - name: Check valid corpus
        run: tyc/target/release/tyc check corpus/valid/
        env:
          TYC_REQUIRE_PYTHON: "1"

      - name: Differential harness (corpus/valid)
        run: scripts/vm-differential.sh --scope valid --baseline scripts/valid-corpus-baseline.txt --jobs 2 --report valid-corpus-report.tsv
        env:
          TYC_REQUIRE_PYTHON: "1"

      - name: Upload valid-corpus differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: valid-corpus-report
          path: valid-corpus-report.tsv
          if-no-files-found: warn

  fmt-corpus:
    name: tyc fmt over a de-formatted corpus (W7-03)
    runs-on: ubuntu-latest
    # `tyc fmt` rewrites files in place and is run without reading the diff,
    # so a formatter bug silently changes programs. The formatter already
    # refuses to write output whose lowered AST differs from its input; this
    # job checks the same property end to end. It copies examples/, stress/
    # and corpus/valid/, removes optional whitespace from the code
    # (`let x: T = 1` -> `let x:T=1`, no space after `,` or `:`, `=` and `->`
    # squeezed, trailing blanks; strings and comments untouched), runs
    # `tyc fmt` over the copy, builds every unit, and requires each one to
    # emit exactly the Python AST the unmodified corpus emits. A file `tyc
    # fmt` refuses also fails the job. Details: docs/differential-testing.md.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # See the test job: cache failures must not fail CI.
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      # The harness parses emitted 3.13 syntax with `ast`, so it needs 3.13.
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # `tyc fmt` wraps `ruff format` when it is on PATH; installing it makes
      # the gate cover the whole formatter, not only the whitespace pass.
      # Same pin as the test job.
      - name: Install ruff
        run: python3.13 -m pip install --quiet ruff==0.15.8

      - name: De-formatted corpus fmt gate
        run: python3.13 scripts/emitted-ast.py fmt-gate --tyc tyc/target/release/tyc --jobs 4 --report fmt-corpus-report.tsv

      - name: Upload per-unit fmt-corpus report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fmt-corpus-report
          path: fmt-corpus-report.tsv
          if-no-files-found: warn

  knob-matrix:
    name: Opt-in knob codegen matrix (T0.4)
    runs-on: ubuntu-latest
    # examples/ and stress/ run entirely on default configuration, so every
    # opt-in codegen path — auto-parallel, the parallel backends, PGO memoise,
    # traceback-remap, the free-threaded targets, the PEP 810 lazy-import
    # lowering — shipped with zero end-to-end coverage. Each fixture under
    # tests/knobs/ builds with the knob on AND off, asserts the rewrite fired
    # (and is absent in the control), and asserts the observable behaviour is
    # unchanged.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch (toolchain pinned via `with:`)
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tyc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tyc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release tyc binary
        working-directory: tyc
        run: cargo build --release --bin tyc

      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Only the model-extra fixture needs this, and only for its execution
      # half; without it that fixture reports "REDUCED to build-only" rather
      # than silently skipping. Installing it here keeps CI at full coverage
      # while `scripts/knob-matrix.sh` itself stays network-free for local runs.
      # No `continue-on-error`: a failed install must fail the job here, with
      # the install as the visible cause. Without pydantic the harness drops
      # the model-extra fixture to build-only and still counts it a PASS, so
      # the job could go green having never exercised the runtime behaviour it
      # was added to gate — the same silent-skip class as the ruff and
      # python3.13 gates. `TYC_REQUIRE_PYTHON=1` below is the second line of
      # defence: it makes *any* reduced-coverage fixture fatal, whatever the
      # cause. (PR #360 review, Codex P2.)
      - name: Install pydantic (model-extra fixture runtime)
        run: python3.13 -m pip install --quiet pydantic

      - name: Knob codegen matrix
        run: scripts/knob-matrix.sh
        env:
          TYC_REQUIRE_PYTHON: "1"
